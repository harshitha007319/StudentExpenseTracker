    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family: 'Poppins', sans-serif;

<body>

<div class="container">

    <div class="logo">💜</div>

    <h1>Student Expense Tracker</h1>

    <p class="subtitle">Your money, your goals, your future!</p>

    <div class="tabs">
        <button class="tab active" id="loginTab" type="button">
            Login
        </button>

        <button class="tab" id="signupTab" type="button">
            Sign Up
        </button>
    </div>

    <form id="authForm">

        <div id="nameField" class="hidden">
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                autocomplete="name"
            >
        </div>

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="At least 8 characters"
            minlength="8"
            autocomplete="current-password"
            required
        >

        <div id="confirmField" class="hidden">
            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter your password"
                minlength="8"
                autocomplete="new-password"
            >
        </div>

        <button class="main-btn" id="submitBtn" type="submit">
            Login 💜
        </button>

    </form>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <p class="footer">Made with 💜 for smarter student spending</p>

</div>

<script>
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");

    const authForm = document.getElementById("authForm");
    const nameField = document.getElementById("nameField");
    const confirmField = document.getElementById("confirmField");

    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");

    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    let mode = "login";

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
    }

    function setMode(newMode) {
        mode = newMode;

        const isSignup = mode === "signup";

        nameField.classList.toggle("hidden", !isSignup);
        confirmField.classList.toggle("hidden", !isSignup);

        nameInput.required = isSignup;
        confirmInput.required = isSignup;

        passwordInput.autocomplete = isSignup
            ? "new-password"
            : "current-password";

        loginTab.classList.toggle("active", !isSignup);
        signupTab.classList.toggle("active", isSignup);

        submitBtn.textContent = isSignup
            ? "Create Account 💜"
            : "Login 💜";

        message.className = "message";
        message.textContent = "";
    }

    loginTab.addEventListener("click", function() {
        setMode("login");
    });

    signupTab.addEventListener("click", function() {
        setMode("signup");
    });

    authForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const email = emailInput.value.trim().toLowerCase();
        const password = passwordInput.value;

        if (password.length < 8) {
            showMessage(
                "Your password must contain at least 8 characters.",
                "error"
            );
            return;
        }

        let users = [];

        try {
            users = JSON.parse(
                localStorage.getItem("demoUsers") || "[]"
            );

            if (!Array.isArray(users)) {
                users = [];
            }
        } catch (error) {
            users = [];
        }

        if (mode === "signup") {
            const name = nameInput.value.trim();

            if (!name) {
                showMessage("Please enter your name.", "error");
                return;
            }

            if (password !== confirmInput.value) {
                showMessage("Passwords do not match!", "error");
                return;
            }

            const existingUser = users.some(function(user) {
                return user.email === email;
            });

            if (existingUser) {
                showMessage(
                    "An account with this email already exists.",
                    "error"
                );
                return;
            }

            /*
             * Learning demo only:
             * Do not use real passwords here.
             * This stores credentials in browser storage,
             * which is not secure for real user accounts.
             */

            users.push({
                name: name,
                email: email,
                password: password
            });

            localStorage.setItem("demoUsers", JSON.stringify(users));

            showMessage(
                "Account created! You can now log in. 💜",
                "success"
            );

            authForm.reset();
            setMode("login");
            emailInput.value = email;

        } else {
            const user = users.find(function(item) {
                return item.email === email &&
                    item.password === password;
            });

            if (!user) {
                showMessage(
                    "Account not found or password is incorrect.",
                    "error"
                );
                return;
            }

            sessionStorage.setItem("demoLoggedIn", "true");
            sessionStorage.setItem("demoUserName", user.name);
            sessionStorage.setItem("demoUserEmail", user.email);

            showMessage(
                "Welcome, " + user.name + "! 💜 Opening your dashboard...",
                "success"
            );

            setTimeout(function() {
                window.location.href = "index.html";
            }, 1000);
        }
    });
</script>

</body>
</html>
